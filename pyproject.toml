[project]
name = "ai-act-copilot"
version = "1.0"
description = "AI Act Compliance Copilot"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "flagembedding==1.4.2",
    "matplotlib>=3.11.2",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "qdrant-client==1.12.2",
]

[project.optional-dependencies]

dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
]

ingest = [
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
]

retrieval = [
    "qdrant-client==1.12.2",
    "sentence-transformers==6.2.0",
    "torch==2.14.1",
    "rank-bm25==0.2.2",
    "rich==14.3.4",
]

mcp = [
    "mcp==1.28.1",
]

graph = [
    "langgraph==1.2.17",
    "langchain==1.4.7",
    "langchain-openai==1.7.2",
    "tenacity==9.2.1",
]

observability = [
    "structlog==26.1.0",
    "matplotlib==3.11.2",
]

eval = [
    "ragas==0.4.3",
    "datasets==5.1.0",
]

ui = [
    "streamlit==1.66.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

all = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "detect-secrets==1.5.0",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "qdrant-client==1.12.2",
    "sentence-transformers==6.2.0",
    "torch==2.14.1",
    "rank-bm25==0.2.2",
    "rich==14.3.4",
    "mcp==1.28.1",
    "langgraph==1.2.17",
    "langchain==1.4.7",
    "langchain-openai==1.7.2",
    "tenacity==9.2.1",
    "structlog==26.1.0",
    "matplotlib==3.11.2",
    "ragas==0.4.3",
    "datasets==5.1.0",
    "streamlit==1.66.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/copilot/py.typed" = "copilot/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "copilot.schemas",
    "copilot.timeline",
    "copilot.retrieval.*",
    "copilot.graph.state",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_openai.*",
    "langgraph.*",
    "qdrant_client.*",
    "mcp.*",
    "sentence_transformers.*",
    "rank_bm25.*",
    "ragas.*",
    "datasets.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: needs real LLM/API",
    "mcp: needs MCP servers and external services",
]
addopts = "-m 'not live and not mcp'"

[tool.coverage.run]
source = ["src/copilot"]
omit = [
    "*/tests/*",
    "*/ui/*",
    "*/mcp_server/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
